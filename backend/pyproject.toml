[project]
name = "alertix-backend"
version = "0.1.0"
description = "Alertix AI backend — real-time multi-hazard monitoring for India"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Alertix AI" }]

dependencies = [
    # Web framework
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "python-multipart==0.0.17",
    "pillow==11.0.0",
    "websockets==13.1",

    # Database
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "psycopg2-binary==2.9.10",
    "alembic==1.14.0",
    "geoalchemy2==0.16.0",

    # Validation / config
    "pydantic==2.10.3",
    "pydantic-settings==2.7.0",
    "python-dotenv==1.0.1",

    # Auth
    "PyJWT[crypto]==2.10.1",
    "bcrypt==4.2.1",

    # HTTP / external APIs
    "httpx==0.28.1",
    "tenacity==9.0.0",

    # Redis (cache + pub/sub + streams)
    "redis[hiredis]==5.2.1",

    # Background scheduling
    "apscheduler==3.11.0",

    # Object storage
    "boto3==1.35.84",

    # Geospatial
    "shapely==2.0.6",
    "geopandas==1.0.1",

    # HTML / RSS scraping (IMD, CWC)
    "beautifulsoup4==4.12.3",
    "feedparser==6.0.11",
    "lxml==5.3.0",

    # Rate limiting / security
    "slowapi==0.1.9",

    # Observability
    "sentry-sdk[fastapi]==2.19.2",
    "structlog==24.4.0",
    "python-json-logger==2.0.7",

    # Email
    "resend==2.5.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
    "ruff==0.8.4",
    "mypy==1.13.0",
    "types-requests",
    "freezegun==1.5.1",
]

# ML / LLM deps are split out so the API container stays slim.
# Phase 2 only — installed when running training/inference workers.
ml = [
    "torch==2.5.1",
    "torchvision==0.20.1",
    "numpy==1.26.4",
    "pandas==2.2.3",
    "scikit-learn==1.5.2",
    "xgboost==2.1.3",
    "catboost==1.2.7",
    "obspy==1.5.0",  # 1.4.x pins sqlalchemy<2, which conflicts with the API pin
    "rasterio==1.4.3",
    "segmentation-models-pytorch==0.3.4",
    "spacy==3.8.2",
    "transformers==4.47.1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "ASYNC"]
# E501: line length (we already set line-length=100, leave wrapped strings alone)
# B008: function-call-in-default-argument — FastAPI's idiomatic Depends()/Query() pattern
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
