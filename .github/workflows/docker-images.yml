name: Docker Images

on:
  push:
    branches: [main]

jobs:
  build-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: backend
            dockerfile: backend/Dockerfile
          - name: ingestion
            context: backend
            dockerfile: backend/Dockerfile.ingestion
          - name: processing
            context: backend
            dockerfile: backend/Dockerfile.processing
          - name: ml
            context: backend
            dockerfile: backend/Dockerfile.ml
          - name: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase image namespace
        id: ns
        run: echo "value=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ steps.ns.outputs.value }}/alertix-${{ matrix.name }}:latest
