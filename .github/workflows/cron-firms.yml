name: Cron — NASA FIRMS Ingestion

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger FIRMS ingestion
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
        run: |
          curl -sf -X POST \
            -H "X-Cron-Token: $CRON_TOKEN" \
            "${BACKEND_URL}/internal/ingest/firms" \
            --max-time 90 \
            || echo "Request failed or timed out"
