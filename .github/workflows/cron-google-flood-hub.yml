name: Cron — Google Flood Hub Ingestion

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger Google Flood Hub ingestion
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
        run: |
          curl -sf -X POST \
            -H "X-Cron-Token: $CRON_TOKEN" \
            "${BACKEND_URL}/internal/ingest/google_flood_hub" \
            --max-time 90 \
            || echo "Request failed or timed out"
